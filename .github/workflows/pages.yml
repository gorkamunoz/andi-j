# Deploys the AnDi-J benchmark website (web_app/) to GitHub Pages.
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Runs on every push to main that changes web_app/, or by hand from the Actions tab.
name: Deploy benchmark website to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web_app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_app
      - id: deployment
        uses: actions/deploy-pages@v4
